info:
  summary: "DLL of the SC4 System Integration Module (SIM)"
  conflicts: "Only compatible with game version 1.1.641, the Windows digital edition."
  description: |-
    The DLL of `pkg=cam:sc4-system-integration-module`, with its settings file SC4SIM.ini. It contains:

    - Advisor rewards: Lua functions to create rewards for the utilities, transportation, environment and health & education advisors.
    - Advanced Water Management: the real efficiency of water buildings in the query dialog and tool tip, a monthly warning for fresh or salt water pumps that produce nothing, and the `ScanPumps` cheat. It replaces `pkg=null-45:advanced-water-management-dll`.
    - Custom power poles: cable geometry and appearance from the pole exemplars, pole styles switched with Tab / Shift+Tab, fractional-angle power lines and the `keepwires` cheat.
    - Power lines across empty zones and farm fields: the zone under each new pole is removed when the drag ends.

    The settings are in SC4SIM.ini, next to the DLL.

  author: "CAM Team, Ulisse Wolf"
  websites:
  - "https://github.com/UlisseWolf/SC4-System-Integration-Module"
  - "https://community.simtropolis.com/files/file/36978-sc4-system-integration-module-sim/"

