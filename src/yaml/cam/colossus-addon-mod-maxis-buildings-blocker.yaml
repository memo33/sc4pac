group: cam
name: maxis-buildings-blocker
version: "1.0.0"
subfolder: 900-overrides
info:
  summary: Hides the Maxis buildings replaced by the CAM from the build menus
  description: |-
    Removes 67 Maxis civic, park, reward, utility and power buildings from the build menus, so that only their CAM versions remain.
    The Casino and Opera House lots are disabled as well, to avoid a duplicate copy of the building.
    Maxis buildings already placed in a city are not affected.
  author: CAM Team
  website: https://community.simtropolis.com/files/file/37682-colossus-addon-mod-maxis-buildings-blocker/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2026_10/Maxis_Buildings_Blocker_Simtropolis.thumb.png.71fb3317771a57013f4c9a7c3d873fde.png

assets:
  - assetId: cam-maxis-buildings-blocker
    include:
      - "/CAM_Maxis_Buildings_Blocker\\.dat$"

