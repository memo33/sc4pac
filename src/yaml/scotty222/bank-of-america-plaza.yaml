info:
  summary: Bank of America Plaza
  description: |
    Bank of America Plaza is a 72-story late-modernist skyscraper in the Main Street District of downtown Dallas, Texas. At a structural height of 921 ft (281 m), it is the tallest skyscraper in the city of Dallas, the 3rd tallest in Texas and the 22nd tallest in the United States, and the 91st tallest building in the world. Construction began in 1983 and finished in 1985.

    Included is a CO$$$ growable and a ploppable.

    **Stats**

    - Lot size: 4x4
    - Growth stage: 8
    - Capacity: CO$$$ 6,500 (CO$$ 9,000 when dilapidated)
    - Plop cost: 99,000 (ploppable)
