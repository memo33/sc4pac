info:
  summary: Central Plaza 1
  description: |
    Central Plaza 1 is the fifth tallest building in Brisbane, Australia, and was designed by the renowned Japanese architect Kurokawa Kisho. Construction was completed in 1988 and at 174 m (571 ft) it was the tallest building in Brisbane upon completion, until Riparian Plaza was completed in 2005.

    Included is a CO$$$ growable and a ploppable.

    **Stats**

    - Lot size: 3x5
    - Growth stage: 8
    - Capacity: CO$$$ 2,513 (CO$$ 4,345 when dilapidated)
    - Plop cost: 5,000 (ploppable)
