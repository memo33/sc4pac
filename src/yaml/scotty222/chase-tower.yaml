info:
  summary: Chase Tower
  description: |
    Chase Tower is a skyscraper in Indianapolis, IN, opened in 1990. It is 253 m tall to the top of its twin spires, or 214 m to the roof height, which makes it the tallest building in the state of Indiana.

    Included is a CO$$$ growable and a ploppable.

    **Stats**

    - Lot size: 3x8
    - Growth stage: 8
    - Capacity: CO$$$ 5,500 (CO$$ 8,000 when dilapidated)
    - Plop cost: 99,000 (ploppable)
