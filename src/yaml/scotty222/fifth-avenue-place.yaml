info:
  summary: Fifth Avenue Place
  description: |
    Fifth Avenue Place (sometimes called Highmark Place for its major tenant) is a skyscraper in Pittsburgh, Pennsylvania, United States. The building was completed in 1988 and has 31 floors. Located at the corner of Liberty Avenue and Fifth Avenue, it rises 616 feet (188 m) above downtown Pittsburgh.

    Included is a CO$$$ growable and a ploppable.

    **Stats**

    - Lot size: 3x3
    - Growth stage: 8
    - Capacity: CO$$$ 2,500 (CO$$ 3,750 when dilapidated)
    - Plop cost: 75,000 (ploppable)
