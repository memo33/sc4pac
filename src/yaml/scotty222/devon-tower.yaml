info:
  summary: Devon Tower
  description: |
    Devon Tower is a skyscraper in Calgary, Alberta, Canada. Located at 400 3rd Avenue SW, it stands at 177 meters (581 ft) or 45 storeys tall. The building was completed in 1988 and is currently the 6th tallest building in Calgary.

    This is a redone version of the author's Canterra Tower BAT, released in 2009. It comes as a CO$$$ growable and a ploppable.

    **Stats**

    - Lot size: 3x3
    - Growth stage: 8
    - Capacity: CO$$$ 3,000 (CO$$ 4,000 when dilapidated)
    - Plop cost: 110,000 (ploppable)
