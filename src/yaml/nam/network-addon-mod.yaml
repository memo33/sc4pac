      assets:
        - &glrAsset
          assetId: nam-gh
          include:
            - *glrPath
            - &glrURailPath "Network Features/.*GroundLightRailxURail"
          exclude:
            - *exe
    - variant: { nam:network-addon-mod:version: legacy }
      assets:
        - <<: *glrAsset
          assetId: nam49-gh

